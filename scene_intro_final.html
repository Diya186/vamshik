<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VAMSHIK'S MIND — Intro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Space Mono',monospace;}

canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}

/* OVERLAY UI */
#ui{position:fixed;inset:0;pointer-events:none;z-index:50;}

/* CINEMATIC BARS */
#bar-t,#bar-b{position:fixed;left:0;right:0;background:#000;z-index:80;transition:height 1.8s cubic-bezier(0.77,0,0.18,1);}
#bar-t{top:0;height:80px;}
#bar-b{bottom:0;height:80px;}
#bar-t.gone,#bar-b.gone{height:0;}

/* TITLE CARD */
#title-card{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:90;opacity:0;transition:opacity 0.6s;
  background:#000;
}
#title-card.show{opacity:1;}
#title-card.fade{opacity:0;}
.tc-eyebrow{font-size:0.6rem;letter-spacing:0.6em;color:#4a2a6a;margin-bottom:1rem;}
.tc-main{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(3rem,9vw,7rem);
  font-weight:900;color:#fff;
  letter-spacing:-0.04em;line-height:0.9;
  text-align:center;
}
.tc-main .g{
  background:linear-gradient(135deg,#c084fc,#7c3aed,#06b6d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.tc-sub{font-size:0.65rem;letter-spacing:0.4em;color:#3a1a5a;margin-top:1.5rem;}

/* GLITCH TEXT */
.glitch{position:relative;animation:glitch 3s infinite;}
.glitch::before,.glitch::after{
  content:attr(data-text);position:absolute;inset:0;
  background:#000;
  font-family:'Unbounded',sans-serif;font-size:inherit;font-weight:900;
  letter-spacing:inherit;line-height:inherit;text-align:center;
}
.glitch::before{color:#06b6d4;clip-path:polygon(0 0,100% 0,100% 35%,0 35%);animation:gb1 3s infinite;}
.glitch::after{color:#f43f5e;clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);animation:gb2 3s infinite;}
@keyframes glitch{0%,89%,100%{transform:none}91%{transform:skewX(-2deg)}93%{transform:skewX(1deg)}95%{transform:none}}
@keyframes gb1{0%,89%,100%{transform:none;opacity:0}90%{transform:translateX(-4px);opacity:1}92%{transform:translateX(2px)}94%{transform:none;opacity:0}}
@keyframes gb2{0%,91%,100%{transform:none;opacity:0}92%{transform:translateX(4px);opacity:1}94%{transform:translateX(-2px)}96%{transform:none;opacity:0}}

/* SUBTITLE */
#sub{
  position:fixed;bottom:2.5rem;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.85);
  border:1px solid rgba(192,132,252,0.2);
  color:#f0e6ff;
  font-size:clamp(0.85rem,1.8vw,1.05rem);
  padding:0.6rem 2rem;border-radius:6px;
  text-align:center;max-width:75vw;line-height:1.6;
  opacity:0;transition:opacity 0.4s;
  pointer-events:none;z-index:100;
}
#sub.show{opacity:1;}

/* DISTRACTION BUBBLES */
.dbubble{
  position:fixed;
  background:rgba(5,0,18,0.92);
  border:1px solid;
  border-radius:8px;
  padding:0.4rem 0.85rem;
  font-size:0.7rem;letter-spacing:0.05em;
  pointer-events:none;z-index:60;
  opacity:0;
  transition:opacity 0.5s;
}
.dbubble.show{opacity:1;}

/* FLASH */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity 0.2s;}

/* SKIP */
#skip{position:fixed;bottom:1rem;right:1.5rem;color:#333;font-size:0.55rem;letter-spacing:0.2em;cursor:pointer;z-index:300;pointer-events:all;transition:color 0.2s;}
#skip:hover{color:#c084fc;}

/* SCANLINE */
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:9999;}
</style>
</head>

// ── CANVAS ──
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ── WORLD ──
const W = () => canvas.width, H = () => canvas.height;

// ── SCENE STATE ──
let phase = "title"; // title | walkin | desk | laptopopen | distract | enter
let t = 0; // frame counter

// ── VAMSHIK ──
const vam = {
  x: -100, y: 0, // start off-screen left
  w: 72, h: 96,
  flipX: false,
  facing: "side",
  walkFrame: 0,
  walkTimer: 0,
  targetX: 0,
  sitting: false,
  bobY: 0,
};

// ── DIYA ──
const diya = {
  x: -200, y: 0,
  w: 59, h: 96,
  active: false,
  flipX: false,
};

// ── PARTICLES ──
const particles = [];
function spawnParticle() {
  particles.push({
    x: Math.random() * W(),
    y: H() * 0.8 + Math.random() * H() * 0.2,
    vy: -(0.3 + Math.random() * 0.8),
    vx: (Math.random()-0.5) * 0.3,
    r: 1 + Math.random() * 2,
    color: ["#c084fc","#7c3aed","#06b6d4","#f59e0b","#f43f5e"][Math.floor(Math.random()*5)],
    life: 1, decay: 0.003 + Math.random()*0.004
  });
}

// ── DISTRACTION BUBBLES ──
const bubblesData = [
  {text:"bro what's for lunch 🍕", color:"#f59e0b", x:"10%", y:"30%"},
  {text:"47 UNREAD EMAILS 📧", color:"#f43f5e", x:"72%", y:"20%"},
  {text:"just one more reel... 📱", color:"#a855f7", x:"65%", y:"55%"},
  {text:"diya's gonna kill me ☠️", color:"#f43f5e", x:"8%", y:"60%"},
  {text:"did they leave me on read?? 👀", color:"#ec4899", x:"55%", y:"75%"},
];
const bubbleEls = [];

function createBubbles() {
  bubblesData.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "dbubble";
    el.textContent = b.text;
    el.style.cssText = `left:${b.x};top:${b.y};border-color:${b.color};color:${b.color};`;
    document.body.appendChild(el);
    bubbleEls.push(el);
  });
}

function showBubble(i) {
  if(bubbleEls[i]) bubbleEls[i].classList.add("show");
}
function hideBubble(i) {
  if(bubbleEls[i]) {
    bubbleEls[i].style.transition = "opacity 1s, transform 1s";
    bubbleEls[i].style.transform = "translateY(-20px)";
    bubbleEls[i].style.opacity = "0";
  }
}

// ── DRAW WORLD ──
function drawScene() {
  const w = W(), h = H();
  const deskY = h * 0.72;
  const floorY = h * 0.82;

  // BG
  const bgGrad = ctx.createRadialGradient(w*0.4, h, 50, w*0.4, h, h*1.2);
  bgGrad.addColorStop(0, "#1a0a2e");
  bgGrad.addColorStop(0.5, "#0a0614");
  bgGrad.addColorStop(1, "#000");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // Grid
  ctx.strokeStyle = "rgba(124,58,237,0.04)";
  ctx.lineWidth = 1;
  for(let x=0;x<w;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

  // Floor glow
  const floorGlow = ctx.createRadialGradient(w*0.4, floorY, 0, w*0.4, floorY, w*0.5);
  floorGlow.addColorStop(0, "rgba(124,58,237,0.08)");
  floorGlow.addColorStop(1, "transparent");
  ctx.fillStyle = floorGlow;
  ctx.fillRect(0, 0, w, h);

  // Wall panel
  ctx.fillStyle = "rgba(255,255,255,0.015)";
  ctx.fillRect(0, 0, w, floorY);
  ctx.fillStyle = "rgba(255,255,255,0.02)";
  ctx.fillRect(0, floorY, w, h - floorY);

  // DESK
  ctx.fillStyle = "#2a1a1a";
  ctx.beginPath();
  ctx.roundRect(w*0.05, deskY, w*0.7, 16, 4);
  ctx.fill();
  ctx.fillStyle = "#120808";
  ctx.fillRect(w*0.05, deskY+14, w*0.7, 4);

  // Desk legs
  ctx.fillStyle = "#1a0e0e";
  ctx.fillRect(w*0.07, deskY+18, 12, h*0.12);
  ctx.fillRect(w*0.07+w*0.65, deskY+18, 12, h*0.12);

  // COFFEE MUG
  const mx = w*0.09, my = deskY - 44;
  ctx.fillStyle = "#2a1a2e"; ctx.beginPath(); ctx.roundRect(mx, my+8, 28, 34, 4); ctx.fill();
  ctx.fillStyle = "#1a0a1e"; ctx.beginPath(); ctx.roundRect(mx+3, my+11, 22, 28, 3); ctx.fill();
  ctx.strokeStyle = "#2a1a2e"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(mx+34, my+20, 8, -0.5, 0.5*Math.PI); ctx.stroke();
  // steam
  const st = Math.sin(t*0.05)*3;
  ctx.strokeStyle = "rgba(150,100,180,0.3)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(mx+8, my+8); ctx.quadraticCurveTo(mx+4+st, my-4, mx+10, my-14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx+18, my+7); ctx.quadraticCurveTo(mx+22-st, my-5, mx+16, my-16); ctx.stroke();

  // NOTEBOOK
  ctx.save();
  ctx.translate(w*0.52, deskY-28);
  ctx.rotate(-0.05);
  ctx.fillStyle = "#1a2a1a"; ctx.beginPath(); ctx.roundRect(0, 0, 80, 44, 3); ctx.fill();
  ctx.strokeStyle = "#2a4a2a"; ctx.lineWidth = 1;
  for(let ly=10;ly<40;ly+=8){ctx.beginPath();ctx.moveTo(6,ly);ctx.lineTo(74,ly);ctx.stroke();}
  ctx.restore();

  // LAPTOP
  drawLaptop(w, h, deskY);

  // POSTER (left wall)
  ctx.fillStyle = "#0d0520"; ctx.beginPath(); ctx.roundRect(w*0.01, h*0.1, 80, 110, 4); ctx.fill();
  ctx.strokeStyle = "#2a1a4e"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(w*0.01, h*0.1, 80, 110, 4); ctx.stroke();
  ctx.fillStyle = "rgba(192,132,252,0.5)"; ctx.font = "20px serif"; ctx.textAlign = "center";
  ctx.fillText("✦", w*0.01+40, h*0.1+65);
  ctx.font = "6px 'Space Mono',monospace"; ctx.fillStyle = "#4a2a6a";
  ctx.fillText("MIND CITY", w*0.01+40, h*0.1+84);
  ctx.textAlign = "left";

  // Particles
  particles.forEach((p,i) => {
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.globalAlpha = p.life * 0.7; ctx.fill();
    ctx.globalAlpha = 1;
    if(p.life <= 0) particles.splice(i,1);
  });

  // DIYA chasing
  if(diya.active) {
    ctx.save();
    if(diya.flipX) { ctx.translate(diya.x + diya.w, diya.y); ctx.scale(-1,1); ctx.drawImage(IMGS.ds, 0, 0, diya.w, diya.h); }
    else { ctx.drawImage(IMGS.ds, diya.x, diya.y, diya.w, diya.h); }
    ctx.restore();
    // Sign
    ctx.fillStyle = "rgba(5,0,18,0.92)";
    ctx.beginPath(); ctx.roundRect(diya.x-30, diya.y-30, 150, 22, 4); ctx.fill();
    ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(diya.x-30, diya.y-30, 150, 22, 4); ctx.stroke();
    ctx.fillStyle = "#f43f5e"; ctx.font = "bold 9px 'Space Mono',monospace"; ctx.textAlign = "center";
    ctx.fillText("SUBMIT BY 11PM ⚠️", diya.x+45, diya.y-14);
    ctx.textAlign = "left";
  }

  // VAMSHIK
  drawVamshik(w, h, deskY, floorY);

  // Vignette
  const vig = ctx.createRadialGradient(w/2, h/2, h*0.2, w/2, h/2, h*0.85);
  vig.addColorStop(0, "transparent");
  vig.addColorStop(1, "rgba(0,0,0,0.65)");
  ctx.fillStyle = vig; ctx.fillRect(0,0,w,h);
}

let laptopOpenAmt = 0; // 0=closed, 1=open
let screenGlow = 0;

function drawLaptop(w, h, deskY) {
  const lx = w*0.18, ly = deskY;
  const lw = 220, lh_base = 14;

  // Base
  ctx.fillStyle = "#1e1e30"; ctx.beginPath(); ctx.roundRect(lx, ly-lh_base, lw, lh_base, 4); ctx.fill();

  // Lid — rotates open
  const angle = -Math.PI/2 * laptopOpenAmt; // 0=flat, -PI/2=open
  ctx.save();
  ctx.translate(lx + lw/2, ly - lh_base);
  ctx.rotate(angle);
  // Draw lid
  ctx.fillStyle = "#1a1a2e";
  ctx.beginPath(); ctx.roundRect(-lw/2, -lh_base*9, lw, lh_base*9, 6); ctx.fill();
  ctx.strokeStyle = "#2a2a4e"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(-lw/2, -lh_base*9, lw, lh_base*9, 6); ctx.stroke();
  // Screen inside lid
  if(laptopOpenAmt > 0.3) {
    const alpha = Math.min(1, (laptopOpenAmt - 0.3) / 0.7);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#050510";
    ctx.beginPath(); ctx.roundRect(-lw/2+8, -lh_base*9+8, lw-16, lh_base*9-16, 3); ctx.fill();
    // Screen content
    if(alpha > 0.5) {
      ctx.fillStyle = "#0d0520";
      ctx.beginPath(); ctx.roundRect(-lw/2+8, -lh_base*9+8, lw-16, lh_base*9-16, 3); ctx.fill();
      ctx.fillStyle = "#c084fc"; ctx.font = "9px 'Space Mono',monospace"; ctx.textAlign = "center";
      ctx.fillText("VAMSHIK'S MIND", 0, -lh_base*5);
      ctx.fillStyle = "#4a2a6a"; ctx.font = "6px 'Space Mono',monospace";
      ctx.fillText("loading...", 0, -lh_base*4);
      // Loading bar
      const barW = (lw-40) * screenGlow;
      ctx.fillStyle = "#7c3aed"; ctx.beginPath(); ctx.roundRect(-lw/2+20, -lh_base*3, barW, 3, 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // Apple-style glow logo on lid back
  ctx.fillStyle = `rgba(192,132,252,${0.1 + laptopOpenAmt * 0.3})`;
  ctx.font = "16px serif"; ctx.textAlign = "center";
  ctx.fillText("✦", 0, -lh_base*4.5);
  ctx.restore();
  ctx.textAlign = "left";

  // Screen glow when open
  if(laptopOpenAmt > 0.8) {
    const g = ctx.createRadialGradient(lx+lw/2, ly-lh_base-60, 10, lx+lw/2, ly-lh_base-60, 120);
    g.addColorStop(0, `rgba(192,132,252,${screenGlow*0.3})`);
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g; ctx.fillRect(lx-50, ly-200, lw+100, 200);
  }
}

function drawVamshik(w, h, deskY, floorY) {
  const px = vam.x, py = vam.y;
  const bob = Math.sin(t * 0.06) * 2;

  ctx.save();
  if(vam.flipX) {
    ctx.translate(px + vam.w, py + bob);
    ctx.scale(-1, 1);
    const img = vam.facing === "side" ? IMGS.vs : IMGS.vf;
    ctx.drawImage(img, 0, 0, vam.w, vam.h);
  } else {
    const img = vam.facing === "side" ? IMGS.vs : IMGS.vf;
    ctx.drawImage(img, px, py + bob, vam.w, vam.h);
  }
  ctx.restore();

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(px + vam.w/2, floorY + 4, vam.w*0.4, 6, 0, 0, Math.PI*2); ctx.fill();

  // Nametag (only when sitting at desk)
  if(phase === "desk" || phase === "laptopopen" || phase === "distract") {
    ctx.fillStyle = "#c084fc";
    ctx.font = "bold 10px 'Space Mono',monospace";
    ctx.textAlign = "center";
    ctx.fillText("VAMSHIK", px + vam.w/2, py - 10 + bob);
    // glow line
    ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(px+vam.w/2, py-2+bob); ctx.lineTo(px+vam.w/2, py-8+bob); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
}

// ── SUBTITLES ──
const subEl = document.getElementById("sub");
function showSub(text, dur) {
  subEl.textContent = text;
  subEl.classList.add("show");
  if(dur) setTimeout(() => subEl.classList.remove("show"), dur - 300);
}
function hideSub() { subEl.classList.remove("show"); }

// ── TIMELINE ──
let tlStarted = false;

function startTimeline() {
  if(tlStarted) return;
  tlStarted = true;

  const titleCard = document.getElementById("title-card");

  // T+0: title card glitches for 3.5s
  // T+3500: fade out title, bars open, canvas fades in
  setTimeout(() => {
    titleCard.classList.add("fade");
    setTimeout(() => { titleCard.style.display = "none"; }, 700);
    document.getElementById("bar-t").classList.add("gone");
    document.getElementById("bar-b").classList.add("gone");
  }, 3500);

  // T+4000: vamshik walks in from left
  setTimeout(() => {
    phase = "walkin";
    const w = W(), h = H();
    vam.x = -100;
    vam.y = h * 0.72 - 96 - 16;
    vam.facing = "side";
    vam.flipX = false;
    vam.targetX = w * 0.24;
  }, 4000);

  // T+5500: show first subtitle while walking
  setTimeout(() => showSub("So my professor asked me to pick two communication concepts...", 3500), 5500);

  // T+7200: vamshik reaches desk, sits (face front)
  setTimeout(() => {
    phase = "desk";
    vam.facing = "front";
  }, 7200);

  // T+9500: second sub
  setTimeout(() => showSub("I could've made a PowerPoint.", 2400), 9500);

  // T+12200: third sub
  setTimeout(() => showSub("But I thought — why explain how the mind works...", 2800), 12200);

  // T+13500: laptop starts opening
  setTimeout(() => {
    phase = "laptopopen";
    const lOpen = setInterval(() => {
      laptopOpenAmt = Math.min(1, laptopOpenAmt + 0.015);
      screenGlow = Math.min(1, screenGlow + 0.008);
      if(laptopOpenAmt >= 1) clearInterval(lOpen);
    }, 16);
  }, 13500);

  // T+15200: fourth sub
  setTimeout(() => showSub("...when I can just take you inside it.", 2800), 15200);

  // T+16000: distraction bubbles start appearing one by one
  setTimeout(() => {
    phase = "distract";
    [0,1,2,3,4].forEach((i) => setTimeout(() => showBubble(i), i * 600));
  }, 16000);

  // T+18000: diya appears chasing
  setTimeout(() => {
    diya.active = true;
    diya.x = W() + 80;
    diya.y = H() * 0.72 - 96 - 16;
    diya.flipX = true;
    showSub("...and watch out for Diya.", 2500);
  }, 18000);

  // T+19500: diya chases across
  const diayaInterval = setInterval(() => {
    if(diya.active && diya.x > W() * 0.45) {
      diya.x -= 1.5;
    }
  }, 16);
  setTimeout(() => clearInterval(diayaInterval), 22000);

  // T+20500: vamshik looks scared, faces side
  setTimeout(() => { vam.flipX = true; }, 20500);

  // T+22000: flash — go to game
  setTimeout(() => {
    hideSub();
    const fl = document.getElementById("flash");
    fl.style.opacity = "1";
    setTimeout(() => { window.location.href = "file1_ei_mind.html"; }, 250);
  }, 22000);
}

// ── VAMSHIK WALK UPDATE ──
function updateVamshik() {
  if(phase === "walkin") {
    const dx = vam.targetX - vam.x;
    if(Math.abs(dx) > 3) {
      vam.x += dx > 0 ? 2.5 : -2.5;
      vam.flipX = dx < 0;
    }
  }
  if(diya.active && phase === "distract") {
    // slow diya approach
  }
}

// ── MAIN LOOP ──
function loop() {
  t++;
  if(Math.random() < 0.15) spawnParticle();
  updateVamshik();
  if(loaded > 0) drawScene();
  requestAnimationFrame(loop);
}

function skipScene() {
  const fl = document.getElementById("flash");
  fl.style.opacity = "1";
  setTimeout(() => { window.location.href = "file1_ei_mind.html"; }, 300);
}

createBubbles();
loop();
setTimeout(startTimeline, 500);
</script>
