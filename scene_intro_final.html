*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Space Mono',monospace;}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}

#title-card{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:200;background:#000;opacity:1;transition:opacity 1.2s;
}
#title-card.fade{opacity:0;pointer-events:none;}
.tc-top{font-size:0.6rem;letter-spacing:0.6em;color:#3a2a5a;margin-bottom:2rem;}
.tc-course{
  font-family:'Unbounded',sans-serif;font-size:clamp(1rem,3vw,2rem);
  font-weight:700;color:#c084fc;letter-spacing:0.1em;text-align:center;
  text-shadow:0 0 40px rgba(192,132,252,0.5);margin-bottom:0.5rem;
}
.tc-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,#c084fc,transparent);margin:1.2rem auto;}
.tc-label{font-size:0.55rem;letter-spacing:0.5em;color:#3a2a5a;margin-bottom:0.5rem;}
.tc-name{
  font-family:'Unbounded',sans-serif;font-size:clamp(2.5rem,8vw,6rem);
  font-weight:900;color:#fff;letter-spacing:-0.03em;text-align:center;line-height:0.95;
}
.tc-bottom{font-size:0.55rem;letter-spacing:0.4em;color:#2a1a3a;margin-top:2rem;}

/* BUBBLES — positioned absolutely via JS from canvas coords */
.bubble{
  position:fixed;
  background:rgba(5,0,18,0.97);
  border:2px solid;border-radius:10px;
  padding:0.5rem 0.9rem;
  font-size:clamp(0.6rem,1.3vw,0.8rem);
  line-height:1.5;pointer-events:none;z-index:150;
  opacity:0;transition:opacity 0.3s;
  white-space:nowrap;text-align:center;
  transform:translateX(-50%); /* center on x anchor */
}
.bubble.show{opacity:1;}
/* tail pointing DOWN from bubble to character */
.bubble::after{
  content:'';position:absolute;
  bottom:-10px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;
}
.bubble-diya{border-color:#f43f5e;color:#f43f5e;}
.bubble-diya::after{border-top-color:#f43f5e;}
.bubble-vam{border-color:#c084fc;color:#c084fc;}
.bubble-vam::after{border-top-color:#c084fc;}

#sub{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.88);border:1px solid rgba(192,132,252,0.2);
  color:#f0e6ff;font-size:clamp(0.8rem,1.6vw,1rem);
  padding:0.55rem 1.75rem;border-radius:6px;
  text-align:center;max-width:75vw;line-height:1.6;
  opacity:0;transition:opacity 0.4s;pointer-events:none;z-index:100;
}
#sub.show{opacity:1;}

.dbubble{
  position:fixed;background:rgba(5,0,18,0.92);border:1px solid;
  border-radius:8px;padding:0.35rem 0.8rem;
  font-size:0.68rem;pointer-events:none;z-index:60;opacity:0;transition:opacity 0.5s;
}
.dbubble.show{opacity:1;}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:400;transition:opacity 0.2s;}
#skip{position:fixed;bottom:1rem;right:1.5rem;color:#333;font-size:0.55rem;letter-spacing:0.2em;cursor:pointer;z-index:500;pointer-events:all;}
#skip:hover{color:#c084fc;}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:9999;}
</style>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener("resize",resize);
const W=()=>canvas.width, H=()=>canvas.height;
let t=0;

// ── CHARACTER SCALE ──
const CHAR_SCALE = 2.2; // both characters drawn at same scale
const CHAR_W = 72 * CHAR_SCALE;
const CHAR_H = 96 * CHAR_SCALE;
const DIYA_W = 77 * CHAR_SCALE;
const DIYA_H = 96 * CHAR_SCALE;

// ── CHARACTERS ──
// x,y = bottom-center of character for easy floor alignment
const vam = { bx:0, by:0, facing:"front", flipX:false };
const diya = { bx:-500, by:0, targetBx:-500, active:false };

function vamLeft(){ return vam.bx - CHAR_W/2; }
function vamTop(){ return vam.by - CHAR_H; }
function diyaLeft(){ return diya.bx - DIYA_W/2; }
function diyaTop(){ return diya.by - DIYA_H; }

// ── BUBBLE SYSTEM ──
// bubbles anchored to character TOP CENTER via canvas coords
const activeBubbles = [];

function makeBubble(text, type, charBx, charTop) {
  const el = document.createElement("div");
  el.className = `bubble bubble-${type}`;
  el.textContent = text;
  // Position: centered on character, above their head
  el.style.left = charBx + "px";
  el.style.top = (charTop - 60) + "px";
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  activeBubbles.push(el);
  return el;
}

function removeBubble(el){
  if(!el)return;
  el.classList.remove("show");
  setTimeout(()=>{if(el.parentNode)el.remove();},400);
  const i=activeBubbles.indexOf(el);
  if(i>-1)activeBubbles.splice(i,1);
}

function removeAllBubbles(){
  [...activeBubbles].forEach(removeBubble);
}

// Update bubble positions if characters move
function updateBubblePositions(){}

const distractData=[
  {text:"bro what's for lunch 🍕",color:"#f59e0b",x:"8%",y:"22%"},
  {text:"47 UNREAD EMAILS 📧",color:"#f43f5e",x:"65%",y:"16%"},

];
const dBubbles=[];
function createDistractBubbles(){

    el.className="dbubble";

    el.style.cssText=`left:${b.x};top:${b.y};border-color:${b.color};color:${b.color};`;

}

// ── PARTICLES ──
const particles=[];
function sp(){
  particles.push({
    x:Math.random()*W(),y:H()*0.8+Math.random()*H()*0.2,
    vy:-(0.3+Math.random()*0.7),vx:(Math.random()-0.5)*0.3,
    r:1+Math.random()*2,
    color:["#c084fc","#7c3aed","#06b6d4","#f59e0b"][Math.floor(Math.random()*4)],
    life:1,decay:0.003+Math.random()*0.004
  });
}

// ── DRAW ──
function drawScene(){
  const w=W(),h=H();
  const floorY = h * 0.78;

  // BG
  const bg=ctx.createRadialGradient(w*0.4,h,50,w*0.4,h,h*1.2);
  bg.addColorStop(0,"#1a0a2e");bg.addColorStop(0.5,"#0a0614");bg.addColorStop(1,"#000");
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);

  // Grid
  ctx.strokeStyle="rgba(124,58,237,0.03)";ctx.lineWidth=1;
  for(let x=0;x<w;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

  // Floor glow
  const fg=ctx.createRadialGradient(w*0.4,floorY,0,w*0.4,floorY,w*0.5);
  fg.addColorStop(0,"rgba(124,58,237,0.06)");fg.addColorStop(1,"transparent");
  ctx.fillStyle=fg;ctx.fillRect(0,0,w,h);

  // Wall/floor
  ctx.fillStyle="rgba(8,3,12,0.8)";ctx.fillRect(0,floorY,w,h-floorY);
  ctx.strokeStyle="#1a0a2e";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,floorY);ctx.lineTo(w,floorY);ctx.stroke();

  // DESK — behind vamshik
  const deskX = w*0.1, deskW = w*0.55, deskY = floorY;
  ctx.fillStyle="#2a1a1a";ctx.beginPath();ctx.roundRect(deskX,deskY-16,deskW,16,4);ctx.fill();
  ctx.fillStyle="#120808";ctx.fillRect(deskX,deskY,deskW,4);
  ctx.fillStyle="#1a0e0e";
  ctx.fillRect(deskX+20,deskY+4,10,h*0.1);
  ctx.fillRect(deskX+deskW-30,deskY+4,10,h*0.1);

  // Desk items
  const mx=deskX+30,my=deskY-52;
  ctx.fillStyle="#2a1a2e";ctx.beginPath();ctx.roundRect(mx,my+8,26,32,4);ctx.fill();
  ctx.fillStyle="#1a0a1e";ctx.beginPath();ctx.roundRect(mx+3,my+11,20,26,3);ctx.fill();
  const st=Math.sin(t*0.05)*2;
  ctx.strokeStyle="rgba(150,100,180,0.25)";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(mx+7,my+7);ctx.quadraticCurveTo(mx+4+st,my-3,mx+9,my-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx+16,my+6);ctx.quadraticCurveTo(mx+19-st,my-4,mx+14,my-14);ctx.stroke();

  // Laptop on desk
  ctx.fillStyle="#1e1e30";ctx.beginPath();ctx.roundRect(deskX+100,deskY-14,200,14,4);ctx.fill();
  ctx.fillStyle="#1a1a2e";ctx.beginPath();ctx.roundRect(deskX+100,deskY-110,200,96,8);ctx.fill();
  ctx.strokeStyle="#2a2a4e";ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(deskX+100,deskY-110,200,96,8);ctx.stroke();
  ctx.fillStyle="rgba(192,132,252,0.12)";ctx.font="14px serif";ctx.textAlign="center";
  ctx.fillText("✦",deskX+200,deskY-54);ctx.textAlign="left";

  // Particles
  particles.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life*0.6;ctx.fill();ctx.globalAlpha=1;
    if(p.life<=0)particles.splice(i,1);
  });

  if(!loaded) return;

  // DIYA — drawn at same scale as vamshik, on floor
  if(diya.active){
    // Move toward target
    const ddx = diya.targetBx - diya.bx;
    if(Math.abs(ddx)>2) diya.bx += ddx>0 ? 3 : -3;
    const flipD = ddx < 0;
    const dl = diyaLeft(), dt = diyaTop();
    ctx.save();
    if(flipD){
      ctx.translate(dl+DIYA_W, dt);ctx.scale(-1,1);
      ctx.drawImage(IMGS.df,0,0,DIYA_W,DIYA_H);
    } else {
      ctx.drawImage(IMGS.df,dl,dt,DIYA_W,DIYA_H);
    }
    ctx.restore();
    // shadow
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.beginPath();ctx.ellipse(diya.bx,floorY+4,DIYA_W*0.35,6,0,0,Math.PI*2);ctx.fill();
  }

  // VAMSHIK — same scale, on floor
  const vl=vamLeft(), vt=vamTop();
  const bob=Math.sin(t*0.05)*2;
  ctx.save();
  if(vam.flipX){
    ctx.translate(vl+CHAR_W,vt+bob);ctx.scale(-1,1);
    ctx.drawImage(vam.facing==="side"?IMGS.vs:IMGS.vf,0,0,CHAR_W,CHAR_H);
  } else {
    ctx.drawImage(vam.facing==="side"?IMGS.vs:IMGS.vf,vl,vt+bob,CHAR_W,CHAR_H);
  }
  ctx.restore();
  // shadow
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.beginPath();ctx.ellipse(vam.bx,floorY+4,CHAR_W*0.35,6,0,0,Math.PI*2);ctx.fill();

  // Vignette
  const vig=ctx.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,h*0.9);
  vig.addColorStop(0,"transparent");vig.addColorStop(1,"rgba(0,0,0,0.65)");
  ctx.fillStyle=vig;ctx.fillRect(0,0,w,h);
}

function loop(){
  t++;
  if(Math.random()<0.1)sp();
  drawScene();
  requestAnimationFrame(loop);
}

const sub=document.getElementById("sub");
function showSub(text,dur){sub.textContent=text;sub.classList.add("show");if(dur)setTimeout(()=>sub.classList.remove("show"),dur-300);}

let diaBub=null, vamBub=null;

function runTimeline(){
  const w=W(),h=H();
  const floorY=h*0.78;

  // Set character floor positions (bottom-center)
  vam.bx = w*0.38; vam.by = floorY; vam.facing="front";
  diya.bx = w*1.2; diya.by = floorY; diya.targetBx = w*1.2;

  // T+4000: fade title
  setTimeout(()=>{
    document.getElementById("title-card").classList.add("fade");
    setTimeout(()=>document.getElementById("title-card").style.display="none",1200);
  },4000);

  // T+5500: diya walks in from right to beside vamshik
  setTimeout(()=>{
    diya.active=true;
    diya.bx=w+100; diya.by=floorY;
    diya.targetBx = vam.bx + CHAR_W/2 + DIYA_W/2 + 10;
  },5500);

  // T+7800: diya arrives — bubble above diya
  setTimeout(()=>{
    diaBub=makeBubble(
      "VAMSHIK. MGNT102 PROJECT. DUE TONIGHT. 📋",
      "diya",
      diya.bx,           // centered on diya
      diya.by - DIYA_H   // top of diya
    );
    vam.facing="side"; vam.flipX=true; // vamshik looks at diya surprised
  },7800);

  // T+9800: vamshik responds — bubble above vamshik
  setTimeout(()=>{
    removeBubble(diaBub);
    vamBub=makeBubble("wait what— RIGHT NOW?? 😰","vam",
      vam.bx, vam.by-CHAR_H);
    vam.facing="front";
  },9800);

  // T+11500: diya points at laptop
  setTimeout(()=>{
    removeBubble(vamBub);
    diaBub=makeBubble("👉 OPEN. THE. LAPTOP.","diya",
      diya.bx, diya.by-DIYA_H);
  },11500);

  // T+13000: vamshik turns to desk, diya walks off
  setTimeout(()=>{
    removeBubble(diaBub);
    vam.facing="side"; vam.flipX=false;
    diya.targetBx = w+200;
  },13000);

  // T+14000: distraction bubbles
  setTimeout(()=>{
    createDistractBubbles();
    dBubbles.forEach((b,i)=>setTimeout(()=>b.classList.add("show"),i*500));
    showSub("every time i try to focus... my brain has other plans.", 3500);
  },14000);

  // T+17500: diya pops back, reminds
  setTimeout(()=>{
    diya.bx=w+80; diya.targetBx=vam.bx+CHAR_W/2+DIYA_W/2+10;
  },17500);
  setTimeout(()=>{
    diaBub=makeBubble("I WILL BE BACK. 😤","diya",diya.bx,diya.by-DIYA_H);
    setTimeout(()=>{removeBubble(diaBub);diya.targetBx=w+200;},2000);
  },19000);

  // T+21000: vamshik opens laptop
  setTimeout(()=>showSub("ok ok. let me think. what even IS communication...",3000),21000);

  // T+24500: flash → game
  setTimeout(()=>{
    hideSub(); dBubbles.forEach(b=>b.style.opacity="0");
    const fl=document.getElementById("flash");
    fl.style.opacity="1";
    setTimeout(()=>{window.location.href="file1_ei_mind.html";},250);
  },24500);
}

function skipScene(){
  document.getElementById("flash").style.opacity="1";
  setTimeout(()=>{window.location.href="file1_ei_mind.html";},300);
}

createDistractBubbles(); // pre-create hidden
loop();
setTimeout(runTimeline,500);
</script>
